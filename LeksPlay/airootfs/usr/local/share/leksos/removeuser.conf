#
# Removes a single user (with userdel) from the system.
# This is typically used in OEM setups or if the live user
# spills into the target system.
#
# The module never fails; if userdel fails, this is logged
# but the module still reports success and installation / setup
# continues as normal.
---
# Username in the target system to be removed.
# LeksOS's live account is "leksplay" (see airootfs/etc/passwd), not the
# upstream ALCI default of "liveuser" -- that default never matches here,
# so the live account and its home directory were being left behind on
# every install alongside the real user created in Calamares.
username: leksplay
