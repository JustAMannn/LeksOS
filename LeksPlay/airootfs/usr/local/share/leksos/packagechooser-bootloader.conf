#
# LeksOS extra-bootloader picker (pretty front page). GRUB is always installed
# separately (grubcfg/bootloader modules, unconditional) -- these are purely
# additive on top of it, same as netinstall-bootloader.conf already documents.
# method: netinstall-select pre-checks the matching group (matched BY NAME) on
# the netinstall-bootloader.conf page right after.
---
mode: optionalmultiple
method: netinstall-select
labels:
    step: "Bootloader"

items:
    - id: rEFInd
      name: "rEFInd"
      description: "rEFInd boot manager (EFI)"
      screenshot: "images/bootloader/refind.png"
    - id: Limine
      name: "Limine"
      description: "Limine boot manager"
      screenshot: "images/bootloader/limine.png"
