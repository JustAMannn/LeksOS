#
# LeksOS: installs whichever extra bootloader(s) got checked in
# netinstall-bootloader.conf, on top of the unconditional GRUB install that
# already ran (grubcfg/bootloader, earlier in this exec phase). Runs inside
# the target chroot (dontChroot: false), same as shellprocess-final.conf.
#
# Every line is prefixed with "-" so a failure here can never take down an
# already-successful GRUB install.
---
dontChroot: false
timeout: 60

script:
    # Each list item already runs via its own `/bin/sh -c`, so plain shell
    # syntax (&&, redirects) works directly without an extra wrapper.
    #
    # rEFInd: refind-install auto-detects the ESP (mounted at /boot/efi,
    # see partition.conf's efiSystemPartition) and registers itself as a
    # boot entry. Safe, non-destructive to the existing GRUB entry.
    - "-pacman -Qs ^refind$ >/dev/null && refind-install"
    # Limine: EFI-only for now -- just deploys the EFI binary onto the ESP.
    # Deliberately NOT doing a BIOS/MBR install here (limine bios-install
    # needs the raw disk device, e.g. /dev/sda, which isn't reliably known
    # from inside this chroot without extra device-detection scripting;
    # getting that wrong means writing to the wrong disk's boot sector).
    # If you need BIOS/legacy Limine, run `limine bios-install /dev/sdX`
    # manually after install.
    - "-pacman -Qs ^limine$ >/dev/null && mkdir -p /boot/efi/EFI/limine && cp /usr/share/limine/BOOTX64.EFI /boot/efi/EFI/limine/BOOTX64.EFI"
